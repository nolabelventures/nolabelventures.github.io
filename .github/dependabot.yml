# Dependabot for nolabel.ventures (automation plan item 48, prepared 22 Oct 2026).
#
# Dependabot reads this file from the repository's DEFAULT branch, and security updates always
# open against it. The default branch is `main` (checked 22 Oct 2026 via the GitHub API; the stale
# `development` branch is no longer the default). target-branch is set explicitly anyway.
#
# Cooldown: version updates are only proposed once a release is 3 days old (security updates
# skip the cooldown by design; the auto-merge workflow adds its own 3-day wait for those).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/functions"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(functions)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "monthly"
      timezone: "Europe/London"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(site)"
