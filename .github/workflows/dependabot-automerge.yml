# Merges Dependabot PRs labelled "automerge-after-3d" once they are at least 3 days old and
# every check on them has passed, including validate (automation plan item 48, prepared 22 Oct 2026;
# validate required since 30 Oct 2026).
#
# Guards, all re-checked at merge time:
#   - author is dependabot[bot] and every commit on the PR was made by Dependabot
#     (a human push onto the branch takes it out of automatic merging)
#   - targets main, not a draft, label still present, checks green, mergeable
#   - the 3 days count from the PR's latest commit, so a rebase or new version restarts them
#   - every check runs against one recorded commit, and the merge is refused if the branch
#     has moved since (--match-head-commit)
#   - at most 5 merges per run
# After merging anything under functions/, it starts deploy-functions.yml, which then waits for
# Ramzi's one-tap approval on the "production" environment. Nothing deploys without that tap.
#
# Scheduled workflows run from the repository's default branch, so this only starts running on
# its own once the default branch is switched to main (runbook step).
name: Dependabot auto-merge

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would merge, merge nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MIN_AGE_HOURS: "72"
      MAX_MERGES: "5"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Merge eligible Dependabot PRs
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          merged=0
          deploy=no
          gh pr list --state open --base main --label automerge-after-3d \
            --json number,author,isDraft --limit 50 > prs.json
          for n in $(jq -r '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]") | select(.isDraft == false) | .number' prs.json); do
            pr=$(gh pr view "$n" --json headRefOid,commits,mergeable,files)
            sha=$(jq -r .headRefOid <<<"$pr")
            last=$(jq -r '[.commits[].committedDate] | max' <<<"$pr")
            age_h=$(( (now - $(date -u -d "$last" +%s)) / 3600 ))
            if [ "$age_h" -lt "$MIN_AGE_HOURS" ]; then
              echo "#$n: latest commit ${age_h}h old, waiting until ${MIN_AGE_HOURS}h"; continue
            fi
            others=$(jq '[.commits[].authors[].login | select(. != "dependabot[bot]")] | length' <<<"$pr")
            if [ "$others" != "0" ]; then
              echo "#$n: has non-Dependabot commits, leaving for Ramzi"; continue
            fi
            # Checks on the exact commit recorded above, all finished and none failing.
            bad=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status != "completed" or (.conclusion | IN("success","skipped","neutral") | not))] | length')
            combined=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq .state)
            if [ "$bad" != "0" ] || { [ "$combined" != "success" ] && [ "$(gh api "repos/$GH_REPO/commits/$sha/status" --jq '.statuses | length')" != "0" ]; }; then
              echo "#$n: checks on ${sha:0:7} not all green, skipping"; continue
            fi
            # The "validate" test (validate.yml) must have actually run and passed: no test, no merge.
            validated=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?check_name=validate" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')
            if [ "$validated" = "0" ]; then
              echo "#$n: no passing validate check on ${sha:0:7}, skipping"; continue
            fi
            state=$(jq -r .mergeable <<<"$pr")
            if [ "$state" != "MERGEABLE" ]; then
              echo "#$n: mergeable=$state, skipping"; continue
            fi
            touches_functions=$(jq '[.files[].path | select(startswith("functions/"))] | length' <<<"$pr")
            if [ "$DRY_RUN" = "true" ]; then
              echo "#$n: WOULD merge (age ${age_h}h, functions files: $touches_functions)"; continue
            fi
            if ! gh pr merge "$n" --squash --delete-branch --match-head-commit "$sha"; then
              echo "#$n: branch moved past ${sha:0:7} or merge refused, skipping"; continue
            fi
            echo "#$n: merged (age ${age_h}h)" | tee -a "$GITHUB_STEP_SUMMARY"
            merged=$((merged + 1))
            if [ "$touches_functions" != "0" ]; then deploy=yes; fi
            if [ "$merged" -ge "$MAX_MERGES" ]; then echo "merge cap reached"; break; fi
          done
          if [ "$deploy" = yes ]; then
            # Merges made with the built-in token do not fire push workflows, so start the
            # deploy explicitly. It stops at the production environment until Ramzi approves.
            gh workflow run deploy-functions.yml --ref main
            echo "Deploy started; waiting for Ramzi's approval." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "merged=$merged deploy=$deploy"
