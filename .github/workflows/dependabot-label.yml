# Labels every Dependabot PR "needs-ramzi". Nothing merges itself: since the 4 Nov 2026 code review
# (a malicious small update could pass the tests and reach production code), each dependency update
# waits for a person to merge it. The old automatic merge is in git history (dependabot-automerge.yml).
name: Dependabot triage

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label needs-ramzi
